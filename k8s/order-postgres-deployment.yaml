apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-postgres-db
  namespace: microservice-network
  labels:
    app: order-postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-postgres-db
  template:
    metadata:
      labels:
        app: order-postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: order-postgres-secret
                  key: postgres-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: order-postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-postgres-secret
                  key: postgres-password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "125Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: order-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: order-postgres-db
  namespace: microservice-network
spec:
  selector:
    app: order-postgres-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None